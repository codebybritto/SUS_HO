<svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradUpper" x1="6" y1="16" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logoGradLower" x1="6" y1="44" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="logoGradIris" cx="27" cy="30" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="55%" stop-color="#0369A1" />
      <stop offset="85%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </radialGradient>
  </defs>

  <!-- Emblem Background Card -->
  <rect x="4" y="6" width="48" height="48" rx="14" fill="#0A192F" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Eye Graphic -->
  <g transform="translate(0, 0)">
    <!-- Upper Eye Eyelid Arc -->
    <path d="M11 30C16 19 21 16 28 16C35 16 40 19 45 30" stroke="url(#logoGradUpper)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Lower Eye Eyelid Arc -->
    <path d="M11 30C16 41 21 44 28 44C35 44 40 41 45 30" stroke="url(#logoGradLower)" stroke-width="3" stroke-linecap="round" />

    <!-- Iris -->
    <circle cx="28" cy="30" r="9.5" fill="url(#logoGradIris)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="28" cy="30" r="5" fill="#050B14" />

    <!-- Cross -->
    <path d="M28 26.5V33.5M24.5 30H31.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <!-- Glint -->
    <circle cx="25.5" cy="27" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">
    Regula<tspan fill="#38BDF8">Oftalmo</tspan>
  </text>
  
  <!-- SUS Capsule Badge -->
  <rect x="194" y="18" width="36" height="18" rx="5" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
  <text x="212" y="31" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="10" fill="#7DD3FC" text-anchor="middle">SUS</text>

  <!-- Subtitle -->
  <text x="64" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="9.5" fill="#94A3B8" letter-spacing="0.2">
    SISTEMA DE REGULAÇÃO OFTALMOLÓGICA
  </text>
</svg>
